name: Build NGE

on:
  push:
  pull_request:
  release:
    types: [published, released]

jobs:
  Checkstyle:
    name: Run Checkstyle
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            11
            21
            25
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Run Checkstyle
        run: |
          ./gradlew checkstyleMain checkstyleTest --console=plain --stacktrace
      - name: Upload Checkstyle Reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: checkstyle-report
          retention-days: 30
          path: |
            **/build/reports/checkstyle/**

  SpotBugs:
    name: Run SpotBugs
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            11
            21
            25
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Run SpotBugs
        run: |
          ./gradlew -PenableSpotBugs=true spotbugsMain spotbugsTest --console=plain --stacktrace
      - name: Upload SpotBugs Reports
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: spotbugs-report
          retention-days: 30
          path: |
            **/build/reports/spotbugs/**

  ScreenshotTests:
    name: Run Screenshot Tests (${{ matrix.renderer }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/onemillionworlds/opengl-docker-image:v1
    strategy:
      fail-fast: false
      matrix:
        renderer: [opengl, angle]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup the java environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Start display server
        run: |
          if [ "${{ matrix.renderer }}" = "angle" ]; then
            # The ANGLE binaries used by jME have no EGL X11 platform support, so run them
            # on a headless Wayland compositor instead of Xvfb.
            # NOTE: this runs BEFORE the ICD resolution below on purpose: installing
            # weston can pull a Mesa upgrade, and newer Mesa renames the lavapipe ICD
            # from lvp_icd.x86_64.json to lvp_icd.json. Resolving the path first and
            # upgrading after leaves VK_ICD_FILENAMES pointing at a stale file.
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq weston
            mkdir -p /tmp/runtime-root
            chmod 700 /tmp/runtime-root
            # Export in this shell too: weston is started below, in this same step.
            export XDG_RUNTIME_DIR=/tmp/runtime-root
            export XDG_SESSION_TYPE=wayland
            export WAYLAND_DISPLAY=wayland-1
            # Force SDL onto Wayland even if a DISPLAY lingers in the container env.
            export SDL_VIDEODRIVER=wayland
            echo "XDG_RUNTIME_DIR=/tmp/runtime-root" >> $GITHUB_ENV
            echo "XDG_SESSION_TYPE=wayland" >> $GITHUB_ENV
            echo "WAYLAND_DISPLAY=wayland-1" >> $GITHUB_ENV
            echo "SDL_VIDEODRIVER=wayland" >> $GITHUB_ENV
            # The container sets DISPLAY=:99 and zink overrides for the OpenGL run;
            # ANGLE talks to Vulkan directly, so drop them to avoid any interference.
            # NOTE: VK_DRIVER_FILES is intentionally NOT blanked here. The Vulkan
            # loader reads VK_DRIVER_FILES before VK_ICD_FILENAMES, so exporting it
            # empty would shadow VK_ICD_FILENAMES and leave the loader with no
            # drivers at all. It is set to the resolved ICD path below instead.
            unset DISPLAY MESA_LOADER_DRIVER_OVERRIDE GALLIUM_DRIVER
            echo "DISPLAY=" >> $GITHUB_ENV
            echo "MESA_LOADER_DRIVER_OVERRIDE=" >> $GITHUB_ENV
            echo "GALLIUM_DRIVER=" >> $GITHUB_ENV
            weston --backend=headless --socket=wayland-1 --idle-time=0 --width=1024 --height=768 &
            echo $! > /tmp/weston.pid
            sleep 2
          else
            Xvfb :99 -ac -screen 0 1024x768x16 &
            export DISPLAY=:99
            echo "DISPLAY=:99" >> $GITHUB_ENV
          fi
          # Resolve the lavapipe ICD file AFTER any apt activity above: the file was
          # renamed from lvp_icd.x86_64.json to lvp_icd.json in newer Mesa releases,
          # so every later step (including Report GL/Vulkan below) sees the right file.
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          if [ -n "$ICD" ]; then
            echo "Using Vulkan ICD: $ICD"
            echo "VK_ICD_FILENAMES=$ICD" >> $GITHUB_ENV
            # VK_DRIVER_FILES is the newer name for the same setting and takes
            # precedence in the Vulkan loader; point it at the same ICD so both
            # old loaders (VK_ICD_FILENAMES) and new ones (VK_DRIVER_FILES) agree.
            # It must never be empty: an empty-but-set VK_DRIVER_FILES shadows
            # VK_ICD_FILENAMES and leaves the loader with no drivers.
            echo "VK_DRIVER_FILES=$ICD" >> $GITHUB_ENV
          else
            echo "::warning::No lavapipe ICD found under /usr/share/vulkan/icd.d/"
          fi
      - name: Report GL/Vulkan
        run: |
          set -x
          echo "renderer=${{ matrix.renderer }}"
          echo "DISPLAY=$DISPLAY"
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"
          echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE"
          echo "SDL_VIDEODRIVER=$SDL_VIDEODRIVER"
          glxinfo | grep -E "OpenGL version|OpenGL renderer|OpenGL vendor" || true
          vulkaninfo --summary || true
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
          echo "VK_DRIVER_FILES=$VK_DRIVER_FILES"
          echo "MESA_LOADER_DRIVER_OVERRIDE=$MESA_LOADER_DRIVER_OVERRIDE"
          echo "GALLIUM_DRIVER=$GALLIUM_DRIVER"
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Test with Gradle Wrapper
        run: |
          if [ "${{ matrix.renderer }}" = "angle" ]; then
            TASK=screenshotTestAngle
          else
            TASK=screenshotTest
          fi
          restart_display_server() {
            if [ "${{ matrix.renderer }}" = "angle" ]; then
              # Kill the exact weston we started (PID saved by the Start step),
              # not anything matching a pattern.
              if [ -f /tmp/weston.pid ]; then
                kill "$(cat /tmp/weston.pid)" 2>/dev/null || true
              fi
              sleep 1
              # Same env discipline as the Start step: weston must not see a stale
              # DISPLAY, and SDL must stay on Wayland. VK_DRIVER_FILES keeps the
              # resolved ICD path from $GITHUB_ENV (unsetting it would also work
              # via the VK_ICD_FILENAMES fallback, but there is no reason to).
              unset DISPLAY MESA_LOADER_DRIVER_OVERRIDE GALLIUM_DRIVER
              export SDL_VIDEODRIVER=wayland
              weston --backend=headless --socket=wayland-1 --idle-time=0 --width=1024 --height=768 &
              echo $! > /tmp/weston.pid
              sleep 2
            else
              # A corrupted X server state (e.g. BadLength on X_PutImage) persists for the
              # life of the server, so give each retry a fresh display.
              pkill Xvfb || true
              sleep 2
              Xvfb :99 -ac -screen 0 1024x768x16 &
              sleep 2
            fi
          }
          for attempt in 1 2 3; do
            echo "Screenshot test (${{ matrix.renderer }}) attempt $attempt of 3"
            if ./gradlew :jme3-screenshot-tests:jme3-screenshot-tests-desktop:$TASK; then
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying..."
              # Stop any crashed/lingering Gradle daemons so a failed JVM
              # (e.g. an X_PutImage Xlib crash) cannot poison the next attempt.
              ./gradlew --stop || true
              restart_display_server
            fi
          done
          echo "All 3 attempts failed."
          exit 1
      - name: Report Screenshot Test failure
        if: failure()
        run: |
          echo "::error title=Screenshot tests (${{ matrix.renderer }}) failed::For details download the 'screenshot-test-report-${{ matrix.renderer }}' artifact and open jme3-screenshot-tests/build/reports/ScreenshotDiffReport.html. If you intended to change visuals: review jme3-screenshot-tests/build/changed-images and commit replacements to jme3-screenshot-tests/src/test/resources (files ending in _angle.png for the ANGLE run). See https://github.com/jMonkeyEngine/jmonkeyengine/blob/master/jme3-screenshot-tests/README.md"
      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshot-test-report-${{ matrix.renderer }}
          retention-days: 30
          path: |
            **/build/reports/**
            **/build/changed-images/**
            **/build/test-results/**

  # Build the engine, we only deploy from ubuntu-latest jdk25
  BuildJMonkey:
    name: Build on ${{ matrix.osName }} jdk${{ matrix.jdk }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write 
      id-token: write
      pages: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        jdk: [25]
        include:
          - os: ubuntu-latest
            osName: linux
            deploy: true
          - os: windows-latest
            osName: windows
            deploy: false
          - os: macOS-latest
            osName: mac
            deploy: false

    steps:
      - name: Select authorized publication context
        id: publication
        shell: bash
        env:
          NGE_REPOSITORY: ${{ github.repository }}
          NGE_EVENT_NAME: ${{ github.event_name }}
          NGE_REF: ${{ github.ref }}
        run: |
          allowed=false
          if [[ "$NGE_REPOSITORY" == "NostrGameEngine/ngengine" ]]; then
            case "$NGE_EVENT_NAME:$NGE_REF" in
              push:refs/heads/master|push:refs/heads/next2|release:refs/tags/*)
                allowed=true
                ;;
            esac
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Clone the repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Setup the java environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            11
            21
            ${{ matrix.jdk }}

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0
      - name: Build Engine
        shell: bash
        env:
          NGE_CAN_PUBLISH: ${{ steps.publication.outputs.allowed }}
          NGE_USE_SNAPSHOT_DEPENDENCIES: ${{ github.ref == 'refs/heads/next2' || github.base_ref == 'next2' }}
        run: |
          # Normal build plus ZIP distribution and merged javadoc
          for attempt in 1 2 3; do
            if ./gradlew -PuseCommitHashAsVersionName=true \
              -PuseSnapshotDependencies="$NGE_USE_SNAPSHOT_DEPENDENCIES" \
              -x checkstyleMain -x checkstyleTest build mergedJavadoc; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 30))
          done

          if [ "${{ matrix.deploy }}" = "true" ] && [ "$NGE_CAN_PUBLISH" = "true" ];
          then
            # We are going to need "zip"
            sudo apt-get update
            sudo apt-get install -y zip

            # We prepare the release for deploy
            mkdir -p ./dist/release/
            mv build/distributions/*.zip dist/release/

            # Install maven artifacts to ./dist/maven and sign them if possible
            if [ "${{ secrets.SIGNING_PASSWORD }}" = "" ];
            then
              echo "Configure the following secrets to enable signing:"
              echo "SIGNING_KEY, SIGNING_PASSWORD"

              ./gradlew publishAllPublicationsToDistFolderRepository \
              -PuseCommitHashAsVersionName=true \
              -PuseSnapshotDependencies="$NGE_USE_SNAPSHOT_DEPENDENCIES" \
              --console=plain --stacktrace
            else
              ./gradlew publishAllPublicationsToDistFolderRepository \
              -PsigningKey='${{ secrets.SIGNING_KEY }}' \
              -PsigningPassword='${{ secrets.SIGNING_PASSWORD }}' \
              -PuseCommitHashAsVersionName=true \
              -PuseSnapshotDependencies="$NGE_USE_SNAPSHOT_DEPENDENCIES" \
              --console=plain --stacktrace
            fi
            ./gradlew --no-daemon configureVersionInfo \
              -PjmeVersionName="$VERSION" \
              build mergedJavadoc
          fi

      - name: Publish Snapshot
        if: matrix.deploy == true && steps.publication.outputs.allowed == 'true' && (github.event_name != 'release' || github.event.release.prerelease == true)
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |       
          export VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              export VERSION=${GITHUB_REF#refs/tags/}
              export VERSION="${VERSION}rc-SNAPSHOT"
              echo "Publishing snapshot $VERSION"
          fi
          ./gradlew --no-daemon --no-parallel configureVersionInfo \
          -PjmeVersionName="$VERSION" \
           publishToSonatype publishAllPublicationsToDistFolderRepository --info

      - name: Publish Release
        if: matrix.deploy == true && steps.publication.outputs.allowed == 'true' && github.event_name == 'release' && github.event.release.prerelease == false
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export VERSION=""
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              export VERSION=${GITHUB_REF#refs/tags/}
              echo "Publishing release $VERSION"
          fi
          ./gradlew --no-daemon --no-parallel  configureVersionInfo \
          -PjmeVersionName="$VERSION" \
          publishToSonatype closeAndReleaseSonatypeStagingRepository publishAllPublicationsToDistFolderRepository --info

      - name: Upload maven artifacts
        if: matrix.deploy == true && steps.publication.outputs.allowed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: maven-artifacts
          path: dist/maven

      - name: Upload pages artifact
        if: matrix.deploy == true && steps.publication.outputs.allowed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/javadoc'

      - name: Deploy to GitHub Pages
        if: matrix.deploy == true && steps.publication.outputs.allowed == 'true' && github.event_name == 'release'
        id: deployment
        uses: actions/deploy-pages@v4
