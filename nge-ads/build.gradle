

def useSnapshotDeps = (jmeVersionTag == 'SNAPSHOT')

ext.jmeNativeImageAdditionalTargetTypes = (
        (ext.has('jmeNativeImageAdditionalTargetTypes') ? ext.jmeNativeImageAdditionalTargetTypes : []) +
                ['org.ngengine.components.Component']
).unique()

dependencies {
    api project(':nge-core')
    api project(':nge-gui')
    implementation(useSnapshotDeps ? libs.nostrads.snapshot : libs.nostrads)
    implementation project(':nge-networking')
}

javadoc {
    // Disable doclint for JDK8+.
    if (JavaVersion.current().isJava8Compatible()){
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}
