def useSnapshotDeps = rootProject.ext.useSnapshotDependencies

dependencies {
    api project(':jme3-core')

    implementation(useSnapshotDeps ? libs.nge.platform.common.snapshot : libs.nge.platform.common)
    testRuntimeOnly(useSnapshotDeps ? libs.nge.platform.jvm.snapshot : libs.nge.platform.jvm)
}

configurations.testRuntimeClasspath.attributes.attribute(
        org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)

tasks.named('test') {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
